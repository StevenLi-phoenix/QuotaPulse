# Every push to main with a line under CHANGELOG.md's [Unreleased] ships a signed, notarized macOS build to
# GitHub Releases (scripts/release.sh, bump "auto"); installed copies update themselves within an hour.
# Secrets: MACOS_CERT_P12_BASE64 / MACOS_CERT_P12_PASSWORD (Developer ID Application identity),
# MACOS_APP_PROFILE_BASE64 (Developer ID provisioning profile for app.lishuyu.quotapulse), ASC_API_KEY_P8
# (App Store Connect API key, Developer role, for notarytool), SPARKLE_ED_PRIVATE_KEY (appcast signatures).
# Variables: ASC_API_KEY_ID, ASC_API_ISSUER_ID.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "auto (minor if [Unreleased] has ### Added, else patch), patch, minor, major or x.y.z"
        default: auto
        required: true
      dry_run:
        description: "Build, notarize and sign, but don't commit, tag or publish"
        type: boolean
        default: false

permissions:
  contents: write

# One release at a time; a push during a run queues the next run, which releases from the newest main.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      XCODEGEN_VERSION: "2.46.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Anything to release?
        id: decide
        run: |
          if awk '/^## \[Unreleased\]/ {f=1; next} /^## \[/ {f=0} f && /^- /' CHANGELOG.md | grep -q .; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "main at $(git log -1 --format='%h %s')"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CHANGELOG.md [Unreleased] is empty at $(git rev-parse --short HEAD); nothing to release"
          fi

      - name: Toolchain
        if: steps.decide.outputs.release == 'true'
        run: |
          xcodebuild -version
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version
          echo "XCODEGEN=$RUNNER_TEMP/xcodegen/bin/xcodegen" >> "$GITHUB_ENV"

      - name: Tests
        if: steps.decide.outputs.release == 'true'
        run: |
          swift test --package-path QuotaCore 2>&1 | tail -n 5
          swift test --package-path QuotaUI 2>&1 | tail -n 5

      - name: Signing keychain, profile and keys
        if: steps.decide.outputs.release == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.MACOS_APP_PROFILE_BASE64 }}
          ASC_KEY: ${{ secrets.ASC_API_KEY_P8 }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          umask 077
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS=$(openssl rand -base64 24)
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          printf %s "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/cert.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KC" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"

          PROFILE="$RUNNER_TEMP/app.provisionprofile"
          printf %s "$PROFILE_BASE64" | base64 -d > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          UUID=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")
          NAME=$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")
          for d in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$PROFILE" "$d/$UUID.provisionprofile"
          done
          echo "profile: $NAME ($UUID), expires $(plutil -extract ExpirationDate raw "$RUNNER_TEMP/profile.plist")"

          printf %s "$ASC_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          printf %s "$SPARKLE_KEY" > "$RUNNER_TEMP/sparkle.key"
          {
            echo "QP_KEYCHAIN=$KC"
            echo "QP_APP_PROFILE=$NAME"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "SPARKLE_KEY_FILE=$RUNNER_TEMP/sparkle.key"
          } >> "$GITHUB_ENV"

      - name: Release
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARY_KEY_ID: ${{ vars.ASC_API_KEY_ID }}
          NOTARY_ISSUER: ${{ vars.ASC_API_ISSUER_ID }}
          BUMP: ${{ inputs.bump || 'auto' }}
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/release.sh "$BUMP" $DRY_RUN_FLAG

      - name: Release log
        if: failure() && steps.decide.outputs.release == 'true'
        run: |
          for f in build/release/*/release.log build/release/*/smoke.log; do
            [ -f "$f" ] || continue
            echo "── $f"
            grep -E 'error:|warning: .*(sign|profile|entitlement)|ERROR|notarytool|status' "$f" | tail -n 60 || true
            tail -n 40 "$f"
          done

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/sparkle.key" "$RUNNER_TEMP/app.provisionprofile" "$RUNNER_TEMP/profile.plist"
